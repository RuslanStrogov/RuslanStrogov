<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Ruslan Strogov">
  <defs>
    <clipPath id="bW"><rect x="0" y="0" width="1200" height="34"/></clipPath>
    <clipPath id="bB"><rect x="0" y="34" width="1200" height="80"/></clipPath>
    <clipPath id="bR"><rect x="0" y="114" width="1200" height="56"/></clipPath>
    <filter id="tsh" x="-15%" y="-40%" width="130%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#001B44" flood-opacity="0.45"/>
    </filter>
    <style>
      .nm { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 46px; font-weight: 700; letter-spacing: .5px; fill: #ffffff; }
      .sb { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 15px; font-weight: 600; letter-spacing: 2.6px; fill: #ffffff; opacity: .92; }
    </style>
  </defs>

  <!-- WHITE stripe -->
  <g clip-path="url(#bW)">
    <path fill="#F1F4F9" d="M0 0 H1200 V136 Q900 112 600 138 T0 120 Z">
      <animate attributeName="d" dur="13s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;0.33;0.66;1" keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
        values="M0 0 H1200 V136 Q900 112 600 138 T0 120 Z;
                M0 0 H1200 V150 Q900 130 600 120 T0 140 Z;
                M0 0 H1200 V124 Q900 148 600 128 T0 112 Z;
                M0 0 H1200 V136 Q900 112 600 138 T0 120 Z"/>
    </path>
  </g>

  <!-- BLUE stripe -->
  <g clip-path="url(#bB)">
    <path fill="#0039A6" d="M0 0 H1200 V136 Q900 112 600 138 T0 120 Z">
      <animate attributeName="d" dur="13s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;0.33;0.66;1" keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
        values="M0 0 H1200 V136 Q900 112 600 138 T0 120 Z;
                M0 0 H1200 V150 Q900 130 600 120 T0 140 Z;
                M0 0 H1200 V124 Q900 148 600 128 T0 112 Z;
                M0 0 H1200 V136 Q900 112 600 138 T0 120 Z"/>
    </path>
  </g>

  <!-- RED stripe -->
  <g clip-path="url(#bR)">
    <path fill="#D52B1E" d="M0 0 H1200 V136 Q900 112 600 138 T0 120 Z">
      <animate attributeName="d" dur="13s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;0.33;0.66;1" keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
        values="M0 0 H1200 V136 Q900 112 600 138 T0 120 Z;
                M0 0 H1200 V150 Q900 130 600 120 T0 140 Z;
                M0 0 H1200 V124 Q900 148 600 128 T0 112 Z;
                M0 0 H1200 V136 Q900 112 600 138 T0 120 Z"/>
    </path>
  </g>

  <!-- hairline so the white stripe stays visible on light themes -->
  <path fill="none" stroke="#8FA0BB" stroke-width="1" opacity="0.85" d="M0 0 H1200 V136 Q900 112 600 138 T0 120 Z"/>

  <g filter="url(#tsh)">
    <text class="nm" x="50%" y="74" text-anchor="middle" dominant-baseline="middle">Ruslan Strogov</text>
    <text class="sb" x="50%" y="98" text-anchor="middle" dominant-baseline="middle">FULLSTACK · AI-АГЕНТЫ · ИНФРАСТРУКТУРА</text>
  </g>
</svg>