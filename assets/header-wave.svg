<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Ruslan Strogov">
  <defs>
    <linearGradient id="rf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="26%" stop-color="#4C7FD1"/>
      <stop offset="52%" stop-color="#0039A6"/>
      <stop offset="100%" stop-color="#D52B1E"/>
    </linearGradient>
    <linearGradient id="rfBack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#0050C8"/>
      <stop offset="100%" stop-color="#E8322A"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="txt" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 46px; font-weight: 700; letter-spacing: .5px; fill: #ffffff; }
    .sub  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 17px; font-weight: 500; letter-spacing: 2.4px; fill: #ffffff; opacity: .88; }
    .sheen { animation: sheen 9s ease-in-out infinite; }
    @keyframes sheen {
      0%   { transform: translateX(-420px); opacity: 0; }
      18%  { opacity: .55; }
      70%  { opacity: .3; }
      100% { transform: translateX(1260px); opacity: 0; }
    }
  </style>

  <!-- back wave -->
  <path fill="url(#rfBack)" opacity="0.34" d="M0 0 H1200 V112 Q900 84 600 112 T0 124 Z">
    <animate attributeName="d" dur="14s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;0.33;0.66;1" keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
      values="M0 0 H1200 V112 Q900 84 600 112 T0 124 Z;
              M0 0 H1200 V96 Q900 128 600 96 T0 116 Z;
              M0 0 H1200 V126 Q900 96 600 122 T0 100 Z;
              M0 0 H1200 V112 Q900 84 600 112 T0 124 Z"/>
  </path>

  <!-- front wave (tricolor) -->
  <path fill="url(#rf)" d="M0 0 H1200 V128 Q900 100 600 126 T0 108 Z">
    <animate attributeName="d" dur="14s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;0.33;0.66;1" keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
      values="M0 0 H1200 V128 Q900 100 600 126 T0 108 Z;
              M0 0 H1200 V110 Q900 136 600 112 T0 132 Z;
              M0 0 H1200 V134 Q900 110 600 138 T0 114 Z;
              M0 0 H1200 V128 Q900 100 600 126 T0 108 Z"/>
  </path>

  <rect x="0" y="0" width="1200" height="90" fill="url(#fade)"/>
  <ellipse class="sheen" cx="0" cy="55" rx="190" ry="150" fill="#ffffff" opacity="0"/>

  <g filter="url(#txt)">
  <text class="name" x="50%" y="60" text-anchor="middle" dominant-baseline="middle">Ruslan Strogov</text>
  <text class="sub" x="50%" y="96" text-anchor="middle" dominant-baseline="middle">FULLSTACK · AI-АГЕНТЫ · ИНФРАСТРУКТУРА</text>
</g>
</svg>