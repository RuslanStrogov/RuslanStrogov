name: Snake animation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake GIF (RF flag palette)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.gif?color_snake=%23D52B1E&color_dots=%23E8EDF6,%23B9C9E4,%2386A5D4,%234E79C4,%230039A6
            dist/snake-dark.gif?color_snake=%23D52B1E&color_dots=%23161b22,%23415578,%236889c4,%230039A6,%23D52B1E

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}